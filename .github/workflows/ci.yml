name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  diagnostic-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify protected-line guard
        run: python tools/verify_protected_guard.py

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install .

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run isolated diagnostic verification cycle
        run: python main.py
