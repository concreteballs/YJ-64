name: YJ-64 Android APK

on:
  push:
    branches: [main]
    paths:
      - 'buildozer.spec'
      - 'main.py'
      - 'src/**'
      - 'services/**'
      - 'config/android_runtime.json'
      - 'android_src/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

concurrency:
  group: yj64-android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build YJ-64 Monitor APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             git zip unzip autoconf automake libtool libltdl-dev pkg-config             zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6             cmake libffi-dev libssl-dev build-essential gettext autopoint

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36

      - name: Validate Python sources
        run: |
          python -m py_compile main.py
          python -m py_compile src/yj64/*.py
          python -m py_compile services/monitor.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Clean previous Android build artifacts
        run: |
          rm -rf bin .buildozer
          mkdir -p bin

      - name: Build APK
        run: |
          export ACLOCAL_PATH="/usr/share/aclocal"
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Validate APK output
        run: |
          set -e
          APK=$(find bin -maxdepth 1 -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: no APK was produced"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK ($SIZE bytes)"
          sha256sum "$APK"

      - name: Upload Build log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: yj64-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload APK
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: yj64-monitor-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 30
